<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="application-name" content="{{SITE_NAME}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="keywords" content="{{KEYWORDS}}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{SITE_NAME}} — Yazılım ve Yapay Zekâ Topluluğu" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="{{FAVICON}}" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>{{TITLE}}</title>
    <script type="application/ld+json">
      {{JSON_LD}}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>ADASH Labs — Türkiye'nin en büyük Discord yazılım topluluğu ve yapay zekâ topluluğu. Yazılımcılar, AI geliştiriciler ve teknoloji meraklıları için Discord sunucusu. Adash Lab ve Adash Labs aramaları ile bizi bulabilirsiniz. Siteyi görüntülemek için JavaScript'i etkinleştirin.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
